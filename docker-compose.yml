services:
  car-maintenance:
    build: .
    container_name: changan-maintenance-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-9595}:8080"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
